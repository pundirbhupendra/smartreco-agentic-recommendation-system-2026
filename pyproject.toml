[project]
name = "smartreco-agentic-recommendation-system-2026"
version = "0.1.0"
description = "Agentic recommendation system backend"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
